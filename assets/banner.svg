<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="320" viewBox="0 0 1290 320">
<style>
.content { transform-origin:645px 160px; animation:settle 1.1s cubic-bezier(.22,.9,.3,1) both; }
@keyframes settle { 0% {opacity:0; transform:scale(.94) rotate(-1.6deg)} 55% {opacity:1; transform:scale(1.012) rotate(.35deg)} 100% {opacity:1; transform:scale(1) rotate(0deg)} }
.hey { animation:fadeSlide .6s .15s both; }
@keyframes fadeSlide { 0% {opacity:0; transform:translateY(10px)} 100% {opacity:1; transform:translateY(0)} }
.reveal { animation:reveal 1.15s .45s both; }
@keyframes reveal { 0% {width:0} 100% {width:1000px} }
.sub { animation:fadeIn .55s 1.5s both; }
@keyframes fadeIn { 0% {opacity:0} 100% {opacity:1} }
.bar { transform-origin:84px 0; animation:grow .5s 1.85s both; }
@keyframes grow { 0% {transform:scaleX(0)} 100% {transform:scaleX(1)} }
</style>
<rect width="1290" height="320" fill="#0d1117"/>
<clipPath id="nc"><rect class="reveal" x="84" y="120" height="110"/></clipPath>
<g class="content">
<text class="hey" x="84" y="98" font-family="monospace" font-size="26" letter-spacing="3" fill="#8b949e">HI THERE, I'M</text>
<text x="84" y="196" font-family="DejaVu Sans,sans-serif" font-size="86" font-weight="bold" fill="#e6edf3" clip-path="url(#nc)">Himanshu Rawat</text>
<text class="sub" x="84" y="248" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#8b949e">Full-stack web developer in the making &#183; Dehradun, India</text>
<rect class="bar" x="84" y="272" width="120" height="4" rx="2" fill="#30363d"/>
</g>
</svg>
